name: Auto Release – cake

on:
  pull_request:
    types: [closed]

    branches:
      - master

permissions:
  contents: write

jobs:
  check:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check merge commit for release intent
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commit } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.pull_request.merge_commit_sha
            });
            const msg = commit.message || '';
            const isRelease = /release:\s*yes/i.test(msg);
            core.info(`Merge commit message:\n${msg}`);
            core.info(`Release intent: ${isRelease}`);
            core.setOutput('release', isRelease ? 'true' : 'false');

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: PAT
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}


      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          gh release create auto-release --title "Auto Release" --notes "$RELEASE_NOTES" --latest
 
